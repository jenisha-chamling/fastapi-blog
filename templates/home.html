{% extends "layout.html" %}

{% block content %}
  <h1>Latest posts</h1>
  {% if posts %}
    {% for post in posts %}
      <article>
        <h2><a href="{{ url_for('get_webpost', post_id=post.id) }}">{{ post.title }}</a></h2>
        <p>{{ post.content }}</p>
        <p class="meta">By {{ post.author }} · {{ post.date_posted }}</p>
      </article>
    {% endfor %}
  {% else %}
    <p>No posts yet.</p>
  {% endif %}
{% endblock content %}
